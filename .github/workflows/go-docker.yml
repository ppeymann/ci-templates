name: Go Docker CI/CD

on:
  workflow_call:
    inputs:
      image:
        description: "Docker image name, e.g. referendum"
        type: string
        required: true
      app-dir:
        description: "Project dir on server (has docker-compose.yml), e.g. ~/referendum"
        type: string
        required: true
      service:
        description: "Compose service to restart, e.g. referendum-api"
        type: string
        required: true
      health-url:
        description: "Health URL checked from inside the server"
        type: string
        required: true
      go-main:
        description: "Main package for release binaries"
        type: string
        default: ./cmd/app
      platform:
        description: "Image platform"
        type: string
        default: linux/amd64
      deploy-branch:
        description: "Branch that auto-deploys"
        type: string
        default: main
      lint-enabled:
        type: boolean
        default: true
      vulncheck-enabled:
        type: boolean
        default: true
      trivy-enabled:
        type: boolean
        default: true
      trivy-fail:
        description: "Fail build on HIGH/CRITICAL vulnerabilities"
        type: boolean
        default: false
      release-enabled:
        type: boolean
        default: true
      health-retries:
        type: number
        default: 20
    secrets:
      SSH_HOST:
        required: true
      SSH_PORT:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true

jobs:
  # ───────────── 1. prepare ─────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      deploy: ${{ steps.meta.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version and deploy decision
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF_NAME" == "${{ inputs.deploy-branch }}" ]]; then
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download modules
        run: go mod download

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  # ───────────── 2. test ─────────────
  test:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests with coverage
        run: go test -p 2 -coverprofile=coverage.txt -covermode=count ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            TOTAL=$(go tool cover -func=coverage.txt | tail -1)
            echo "$TOTAL"
            echo "### Coverage: \`$TOTAL\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.txt
          retention-days: 7
          if-no-files-found: ignore

  # ───────────── 3. build ─────────────
  build:
    needs: [prepare, test, lint, vulncheck]
    if: |
      always() &&
      needs.prepare.outputs.deploy == 'true' &&
      needs.test.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.vulncheck.result == 'success' || needs.vulncheck.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build \
            --platform ${{ inputs.platform }} \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            --load .

      - name: Scan image (trivy)
        if: inputs.trivy-enabled
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ inputs.trivy-fail && '1' || '0' }}

      - name: Save image
        run: docker save "$IMAGE:$VERSION" "$IMAGE:latest" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 3

  # ───────────── 4. deploy ─────────────
  deploy:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.image }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            ServerAliveInterval 30
          EOF

      - name: Test SSH connection
        run: ssh server 'echo "connected as $(whoami) on $(hostname)"'

      - name: Ship image
        run: gunzip -c image.tar.gz | ssh server 'docker load'

      - name: Restart service
        run: |
          ssh server "cd ${{ inputs.app-dir }} && \
            docker compose up -d --no-build --force-recreate ${{ inputs.service }}"

      - name: Health check
        run: |
          for i in $(seq 1 ${{ inputs.health-retries }}); do
            if ssh server "curl -fsS ${{ inputs.health-url }}" >/dev/null 2>&1; then
              echo "healthy ✅ ($VERSION)"
              echo "### Deployed \`$IMAGE:$VERSION\` ✅" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting... ($i)"
            sleep 3
          done
          echo "service did not become healthy ❌"
          ssh server "cd ${{ inputs.app-dir }} && docker compose logs --tail 50 ${{ inputs.service }}"
          exit 1

      - name: Cleanup old images
        if: always()
        run: ssh server 'docker image prune -f' || true

  # ───────────── release (tags only) ─────────────
  release:
    needs: [prepare, deploy]
    if: |
      always() &&
      inputs.release-enabled &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          NAME=${{ inputs.image }}
          for t in linux/amd64 linux/arm64 darwin/arm64; do
            OS=${t%/*}
            ARCH=${t#*/}
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/$NAME-$VERSION-$OS-$ARCH" ${{ inputs.go-main }}
          done
          cd dist && sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*