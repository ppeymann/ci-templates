            while IFS= read -r tok; do
              [ -z "$tok" ] && continue
              if [[ "$tok" =~ ^([1-5])xx$ ]]; then
                count=$((count + 1))
                continue
              elif [[ "$tok" =~ ^([0-9]{3})-([0-9]{3})$ ]]; then
                lo=${BASH_REMATCH[1]}
                hi=${BASH_REMATCH[2]}
                if (( 10#$lo > 10#$hi )); then
                  echo "::error::Invalid health-status-codes range '${tok}'."
                  exit 1
                fi
                count=$((count + 1))
              elif [[ "$tok" =~ ^[0-9]{3}$ ]]; then
                count=$((count + 1))
              else
                echo "::error::Invalid health-status-codes token '${tok}'. Use 2xx, 200, or 200-399, comma-separated."
                exit 1
              fi
            done <<< "$spec"
            if [ "$count" -eq 0 ]; then
              echo "::error::health-status-codes has no status tokens. Use 2xx, 200, or 200-399, comma-separated."
              exit 1
            fi
          }

          health_code_ok() {
            local code raw spec tok lo hi
            code=$(printf '%s' "$1" | tr -d '[:space:]')
            [[ "$code" =~ ^[0-9]{3}$ ]] || return 1
            raw=$(read_health_spec) || exit $?
            spec=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr ',;' '\n' | tr -s '[:space:]' '\n')
            while IFS= read -r tok; do
              [ -z "$tok" ] && continue
              if [[ "$tok" =~ ^([1-5])xx$ ]]; then
                if [[ "${code:0:1}" == "${BASH_REMATCH[1]}" ]]; then
                  return 0
                fi
              elif [[ "$tok" =~ ^([0-9]{3})-([0-9]{3})$ ]]; then
                lo=${BASH_REMATCH[1]}
                hi=${BASH_REMATCH[2]}
                if (( 10#$code >= 10#$lo && 10#$code <= 10#$hi )); then
                  return 0
                fi
              elif [[ "$tok" =~ ^[0-9]{3}$ ]]; then
                if [[ "$code" == "$tok" ]]; then
                  return 0
                fi
              else
                echo "::error::Invalid health-status-codes token '${tok}'. Use 2xx, 200, or 200-399, comma-separated."
                exit 1
              fi
            done <<< "$spec"
            return 1
          }
          validate_health_spec
          for i in $(seq 1 ${{ inputs.health-retries }}); do
            CODE=$(ssh server "curl -s -o /dev/null -w '%{http_code}' $HEALTH_URL" || echo 000)
            if health_code_ok "$CODE"; then
              echo "healthy ✅ (rollback, HTTP $CODE)"
              echo "### ↩️ Rolled back \`$IMAGE\` to :$PREV ✅" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting... ($i, HTTP $CODE)"
            sleep 3
          done
          echo "service did not become healthy ❌"
          ssh server "cd $APP_DIR && docker compose logs --tail 50 $SERVICES"
          exit 1

  # ───────────── release (tags only) ─────────────
  release:
    needs: [prepare, test, deploy]
    if: always() && inputs.release-enabled && startsWith(github.ref, 'refs/tags/v') && needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.deploy.result == 'success' || (needs.deploy.result == 'skipped' && !inputs.deploy-enabled))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
