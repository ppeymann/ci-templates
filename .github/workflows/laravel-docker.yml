              if [ -n "$fp" ] && grep -qxF "$fp" "$trusted"; then
                printf '%s\n' "$line" >> ~/.ssh/known_hosts
                echo "SSH host key accepted: $fp"
                matched=$((matched + 1))
              else
                ignored=$((ignored + 1))
              fi
            done <"$scan"
            if [ "$ignored" -gt 0 ]; then
              echo "Ignored ${ignored} scanned host key(s) that were not in the trusted set."
            fi
            if [ "$matched" -eq 0 ]; then
              echo "::error::SSH host key verification failed for ${SSH_HOST}:${SSH_PORT}. No scanned key matches the trusted fingerprint(s)."
              echo "Scanned:"
              ssh-keygen -lf "$scan" -E sha256 || true
              echo "Trusted:"
              cat "$trusted"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            UpdateHostKeys no
            ServerAliveInterval 30
