          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          scan=$(mktemp)
          scan_err=$(mktemp)
          if ! ssh-keyscan -p "$SSH_PORT" -T 10 "$SSH_HOST" >"$scan" 2>"$scan_err"; then
            echo "::error::ssh-keyscan failed for ${SSH_HOST}:${SSH_PORT}"
            cat "$scan_err"
            exit 1
          fi
          grep -vE '^[[:space:]]*(#|$)' "$scan" >"${scan}.clean" || true
          mv "${scan}.clean" "$scan"
          if [ ! -s "$scan" ]; then
            echo "::error::ssh-keyscan returned no host keys for ${SSH_HOST}:${SSH_PORT}"
            cat "$scan_err"
            exit 1
          fi

          if [ "${ALLOW_INSECURE_SSH:-false}" = "true" ]; then
            echo "::warning::allow-insecure-ssh is true: SSH host key verification is disabled. The key returned by ssh-keyscan is trusted as-is. Do not use this against a host you cannot already trust."
            cat "$scan" > ~/.ssh/known_hosts
          else
            material=$(mktemp)
            printf '%s\n' "${SSH_HOST_FINGERPRINT:-}" >"$material"
            printf '%s\n' "${SSH_KNOWN_HOSTS:-}" >>"$material"
            if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
              kh=$(mktemp)
              printf '%s\n' "$SSH_KNOWN_HOSTS" >"$kh"
              if ssh-keygen -lf "$kh" -E sha256 >"${kh}.fp" 2>/dev/null; then
                cat "${kh}.fp" >>"$material"
              else
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ''|\#*) continue ;;
                  esac
                  fp=$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)
                  if [ -n "$fp" ]; then
                    printf '%s\n' "$fp" >>"$material"
                  fi
                done <"$kh"
              fi
            fi
            trusted=$(mktemp)
            sed -E 's/[Ss][Hh][Aa]256:/SHA256:/g' "$material" \
              | grep -oE 'SHA256:[A-Za-z0-9+/]+={0,2}' \
              | sort -u >"$trusted" || true
            if [ ! -s "$trusted" ]; then
              echo "::error::Refusing to deploy: no trusted SSH host key for ${SSH_HOST}:${SSH_PORT}. Set secret SSH_KNOWN_HOSTS (known_hosts lines or a public key) or input ssh-host-fingerprint (SHA256 fingerprint from ssh-keygen -lf). Verify that value out of band before saving it. To skip this check, set allow-insecure-ssh: true (insecure; off by default)."
              exit 1
            fi
            : > ~/.ssh/known_hosts
            matched=0
            ignored=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              fp=$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)
              if [ -n "$fp" ] && grep -qxF "$fp" "$trusted"; then
                printf '%s\n' "$line" >> ~/.ssh/known_hosts
                echo "SSH host key accepted: $fp"
                matched=$((matched + 1))
              else
                ignored=$((ignored + 1))
              fi
            done <"$scan"
            if [ "$ignored" -gt 0 ]; then
              echo "Ignored ${ignored} scanned host key(s) that were not in the trusted set."
            fi
            if [ "$matched" -eq 0 ]; then
              echo "::error::SSH host key verification failed for ${SSH_HOST}:${SSH_PORT}. No scanned key matches the trusted fingerprint(s)."
              echo "Scanned:"
              ssh-keygen -lf "$scan" -E sha256 || true
              echo "Trusted:"
              cat "$trusted"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            UpdateHostKeys no
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        if: env.SKIP != '1'
        run: ssh server 'echo "connected as $(whoami) on $(hostname)"'

      - name: Remove review app
        if: env.SKIP != '1'
        run: |
          ssh server "cd $REVIEW_DIR && IMAGE_TAG=none REVIEW_HOST=none SLUG=$SLUG \
            docker compose -p $PROJECT -f $REVIEW_FILE down -v --remove-orphans" || true
          ssh server "docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^${{ inputs.image }}:sha-' | xargs -r docker image rm 2>/dev/null; docker image prune -f" || true
          echo "### 🧹 Removed review app \`$PROJECT\`" >> "$GITHUB_STEP_SUMMARY"

  # ───────────── manual rollback (workflow_dispatch + rollback: true) ─────────────
  rollback:
    if: inputs.deploy-enabled && (inputs.rollback)
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || (inputs.stage-app-dir != '' && github.ref_name != inputs.deploy-branch) && 'stage' || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.image }}-rollback
      cancel-in-progress: false
    env:
      IMAGE: ${{ inputs.image }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Pick target
        env:
          STAGE_RE: ${{ inputs.stage-branches }}
        run: |
          T=dev
