            echo "::warning::allow-insecure-ssh is true: SSH host key verification is disabled. The key returned by ssh-keyscan is trusted as-is. Do not use this against a host you cannot already trust."
            cat "$scan" > ~/.ssh/known_hosts
          else
            material=$(mktemp)
            printf '%s\n' "${SSH_HOST_FINGERPRINT:-}" >"$material"
            printf '%s\n' "${SSH_KNOWN_HOSTS:-}" >>"$material"
            if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
              kh=$(mktemp)
              printf '%s\n' "$SSH_KNOWN_HOSTS" >"$kh"
              if ssh-keygen -lf "$kh" -E sha256 >"${kh}.fp" 2>/dev/null; then
                cat "${kh}.fp" >>"$material"
              else
                while IFS= read -r line || [ -n "$line" ]; do
