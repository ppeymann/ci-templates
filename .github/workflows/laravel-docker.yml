name: Laravel Docker CI/CD

on:
  workflow_call:
    inputs:
      image:
        description: "Docker image name, e.g. my-app"
        type: string
        required: true
      app-dir:
        description: "Project dir on server (has docker-compose.yml), e.g. ~/my-app"
        type: string
        required: true
      services:
        description: "Compose services to recreate, space separated, e.g. \"api worker\""
        type: string
        required: true
      health-url:
        description: "Health URL checked from inside the server (accepted statuses: health-status-codes, default 2xx)"
        type: string
        required: true
      working-directory:
        description: "Folder of the project inside the repo (has the Dockerfile)"
        type: string
        default: "."
      php-version:
        type: string
        default: "8.3"
      node-build:
        description: "Also run npm ci && npm run build (Vite assets) in CI"
        type: boolean
        default: false
      test-env:
        description: "Extra KEY=VALUE lines for the test job"
        type: string
        default: ""
      migrate-enabled:
        description: "Run php artisan migrate --force before restart"
        type: boolean
        default: true
      optimize-enabled:
        description: "Run php artisan optimize after restart"
        type: boolean
        default: true
      migrate-service:
        description: "Compose service used to run migrations (default: first of services)"
        type: string
        default: ""
      platform:
        type: string
        default: linux/amd64
      deploy-branch:
        type: string
        default: main
      trivy-enabled:
        type: boolean
        default: true
      trivy-fail:
        description: "Fail build on HIGH/CRITICAL vulnerabilities"
        type: boolean
        default: false
      release-enabled:
        type: boolean
        default: true
      health-retries:
        type: number
        default: 20
      stage-branches:
        description: "Regex of branches deployed to the `stage` environment (only if stage-app-dir is set)"
        type: string
        default: develop
      stage-app-dir:
        description: "Project dir on server for STAGE (empty = stage disabled)"
        type: string
        default: ""
      stage-services:
        description: "Compose service(s) for STAGE (empty = same as services)"
        type: string
        default: ""
      stage-health-url:
        description: "Health URL for STAGE (empty = same as health-url)"
        type: string
        default: ""
      review-enabled:
        description: "Deploy a review app per branch / same-repo PR (Traefik + wildcard DNS)"
        type: boolean
        default: false
      review-domain:
        description: "Review apps live at <slug>.<review-domain>"
        type: string
        default: ""
      review-app-dir:
        description: "Dir on server holding the review compose file (empty = app-dir)"
        type: string
        default: ""
      review-compose-file:
        description: "Compose file for review apps (uses IMAGE_TAG, REVIEW_HOST, SLUG)"
        type: string
        default: docker-compose.review.yml
      pr-coverage-comment:
        description: "Post a sticky coverage comment on pull requests (caller grants pull-requests: write)"
        type: boolean
        default: true
      auto-rollback:
        description: "On a failed deploy, retag :previous → :latest and recreate the services"
        type: boolean
        default: true
      rollback:
        description: "Manual rollback: skip build, restore :previous (use with workflow_dispatch)"
        type: boolean
        default: false
      lint-enabled:
        description: "Run lint / format / vet steps"
        type: boolean
        default: true
      test-enabled:
        description: "Run the test job (when false, build/deploy still run)"
        type: boolean
        default: true
      build-enabled:
        description: "Build (and push) the artifact; when false, deploy and release are skipped too"
        type: boolean
        default: true
      deploy-enabled:
        description: "Run deploy jobs (incl. stage/review/cleanup/rollback); false = CI only"
        type: boolean
        default: true
      health-status-codes:
        description: "Comma-separated HTTP statuses that count as healthy. Tokens: 2xx, 200, 200-399. Default is 2xx only. Set 200-499 to keep the previous behavior."
        type: string
        default: "2xx"
      ssh-host-fingerprint:
        description: "Trusted SSH host-key fingerprint(s), SHA256:… from ssh-keygen -lf. Comma-separated. Alternative to the SSH_KNOWN_HOSTS secret."
        type: string
        default: ""
      allow-insecure-ssh:
        description: "INSECURE opt-out. Trust the ssh-keyscan key without comparing it to a trusted fingerprint. Off by default."
        type: boolean
        default: false
    secrets:
      SSH_HOST:
        description: "Server hostname or IP. Required only when a deploy job runs."
        required: false
      SSH_PORT:
        description: "SSH port. Required only when a deploy job runs."
        required: false
      SSH_USER:
        description: "SSH user. Required only when a deploy job runs."
        required: false
      SSH_KEY:
        description: "Private deploy key. Required only when a deploy job runs."
        required: false
      SSH_KNOWN_HOSTS:
        description: "Trusted server public keys (known_hosts lines or a public key) or SHA256 fingerprints. Required for deploy unless ssh-host-fingerprint is set or allow-insecure-ssh is true."
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ───────────── 1. prepare ─────────────
  prepare:
    if: ${{ !inputs.rollback && !(github.event_name == 'delete' || (github.event_name == 'pull_request' && github.event.action == 'closed')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      deploy: ${{ steps.meta.outputs.deploy }}
      target: ${{ steps.meta.outputs.target }}
      slug: ${{ steps.meta.outputs.slug }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version and deploy decision
        id: meta
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STAGE_RE: ${{ inputs.stage-branches }}
        run: |
          slugify() { echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-30 | sed -E 's/-+$//'; }
          TARGET=none
          SLUG=""
          VERSION="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TARGET=production
            VERSION="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ "${{ inputs.review-enabled }}" = true ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              TARGET=review
              SLUG="pr-$PR_NUMBER"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            if [ "$GITHUB_REF_NAME" = "${{ inputs.deploy-branch }}" ]; then
              TARGET=dev
            elif [ -n "${{ inputs.stage-app-dir }}" ] && [ -n "$STAGE_RE" ] && [[ "$GITHUB_REF_NAME" =~ ^($STAGE_RE)$ ]]; then
              TARGET=stage
            elif [ "${{ inputs.review-enabled }}" = true ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              TARGET=review
              SLUG=$(slugify "$GITHUB_REF_NAME")
            fi
          fi
          DEPLOY=false
          [ "$TARGET" != none ] && DEPLOY=true
          {
            echo "version=$VERSION"; echo "deploy=$DEPLOY"; echo "target=$TARGET"; echo "slug=$SLUG"
          } >> "$GITHUB_OUTPUT"
          echo "### Target: \`$TARGET\` ($VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, pdo_pgsql, redis, intl, zip, bcmath
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (code style)
        if: inputs.lint-enabled
        run: |
          if [ -f vendor/bin/pint ]; then
            vendor/bin/pint --test
          else
            echo "pint not installed, skipping"
          fi

  # ───────────── 2. test ─────────────
  test:
    needs: prepare
    if: inputs.test-enabled
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: test
      DB_USERNAME: test
      DB_PASSWORD: test
      REDIS_HOST: localhost
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, pdo_pgsql, redis, intl, zip, bcmath
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: inputs.node-build
        with:
          node-version: "22"

      - name: Build assets
        if: inputs.node-build
        run: npm ci --no-audit --no-fund && npm run build

      - name: Extra test env
        if: inputs.test-env != ''
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && echo "$line" >> "$GITHUB_ENV"
          done <<'ENVEOF'
          ${{ inputs.test-env }}
          ENVEOF

      - name: Prepare .env
        run: |
          [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env
          php artisan key:generate --force

      - name: Tests
        run: php artisan test

  # ───────────── 3. build ─────────────
  build:
    needs: [prepare, test]
    if: always() && inputs.build-enabled && needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.prepare.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        run: |
          docker buildx build \
            --platform ${{ inputs.platform }} \
            -t "$IMAGE:$VERSION" \
            --load ${{ inputs.working-directory }}

      - name: Scan image (trivy)
        if: inputs.trivy-enabled
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ inputs.trivy-fail && '1' || '0' }}

      - name: Save image
        run: docker save "$IMAGE:$VERSION" | gzip > image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 3

  # ───────────── 4. deploy (dev / stage / production) ─────────────
  deploy:
    needs: [prepare, build]
    if: always() && inputs.deploy-enabled && needs.build.result == 'success' && (needs.prepare.outputs.target == 'dev' || needs.prepare.outputs.target == 'stage' || needs.prepare.outputs.target == 'production')
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.target }}
    concurrency:
      group: deploy-${{ inputs.image }}-${{ needs.prepare.outputs.target }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      APP_DIR: ${{ needs.prepare.outputs.target == 'stage' && inputs.stage-app-dir || inputs.app-dir }}
      SERVICES: ${{ needs.prepare.outputs.target == 'stage' && inputs.stage-services != '' && inputs.stage-services || inputs.services }}
      HEALTH_URL: ${{ needs.prepare.outputs.target == 'stage' && inputs.stage-health-url || inputs.health-url }}
      CHAN: ${{ needs.prepare.outputs.target == 'stage' && 'stage' || 'latest' }}
      PREV: ${{ needs.prepare.outputs.target == 'stage' && 'stage-previous' || 'previous' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST_FINGERPRINT: ${{ inputs.ssh-host-fingerprint }}
          ALLOW_INSECURE_SSH: ${{ inputs.allow-insecure-ssh }}
        run: |
          set -euo pipefail

          missing=()
          [ -z "${SSH_HOST:-}" ] && missing+=(SSH_HOST)
          [ -z "${SSH_PORT:-}" ] && missing+=(SSH_PORT)
          [ -z "${SSH_USER:-}" ] && missing+=(SSH_USER)
          [ -z "${SSH_KEY:-}" ] && missing+=(SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Deploy is enabled but these secrets are empty: ${missing[*]}. Pass SSH_HOST, SSH_PORT, SSH_USER and SSH_KEY, or set deploy-enabled: false for CI only."
            exit 1
          fi

          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          scan=$(mktemp)
          scan_err=$(mktemp)
          if ! ssh-keyscan -p "$SSH_PORT" -T 10 "$SSH_HOST" >"$scan" 2>"$scan_err"; then
            echo "::error::ssh-keyscan failed for ${SSH_HOST}:${SSH_PORT}"
            cat "$scan_err"
            exit 1
          fi
          grep -vE '^[[:space:]]*(#|$)' "$scan" >"${scan}.clean" || true
          mv "${scan}.clean" "$scan"
          if [ ! -s "$scan" ]; then
            echo "::error::ssh-keyscan returned no host keys for ${SSH_HOST}:${SSH_PORT}"
            cat "$scan_err"
            exit 1
          fi

          if [ "${ALLOW_INSECURE_SSH:-false}" = "true" ]; then
            echo "::warning::allow-insecure-ssh is true: SSH host key verification is disabled. The key returned by ssh-keyscan is trusted as-is. Do not use this against a host you cannot already trust."
            cat "$scan" > ~/.ssh/known_hosts
          else
            material=$(mktemp)
            printf '%s\n' "${SSH_HOST_FINGERPRINT:-}" >"$material"
            printf '%s\n' "${SSH_KNOWN_HOSTS:-}" >>"$material"
            if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
              kh=$(mktemp)
              printf '%s\n' "$SSH_KNOWN_HOSTS" >"$kh"
              if ssh-keygen -lf "$kh" -E sha256 >"${kh}.fp" 2>/dev/null; then
                cat "${kh}.fp" >>"$material"
              else
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ''|\#*) continue ;;
                  esac
                  fp=$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)
                  if [ -n "$fp" ]; then
                    printf '%s\n' "$fp" >>"$material"
                  fi
                done <"$kh"
              fi
            fi
            trusted=$(mktemp)
            sed -E 's/[Ss][Hh][Aa]256:/SHA256:/g' "$material" \
              | grep -oE 'SHA256:[A-Za-z0-9+/]+={0,2}' \
              | sort -u >"$trusted" || true
            if [ ! -s "$trusted" ]; then
              echo "::error::Refusing to deploy: no trusted SSH host key for ${SSH_HOST}:${SSH_PORT}. Set secret SSH_KNOWN_HOSTS (known_hosts lines or a public key) or input ssh-host-fingerprint (SHA256 fingerprint from ssh-keygen -lf). Verify that value out of band before saving it. To skip this check, set allow-insecure-ssh: true (insecure; off by default)."
              exit 1
            fi
            : > ~/.ssh/known_hosts
            matched=0
            ignored=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              fp=$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)
              if [ -n "$fp" ] && grep -qxF "$fp" "$trusted"; then
                printf '%s\n' "$line" >> ~/.ssh/known_hosts
                echo "SSH host key accepted: $fp"
                matched=$((matched + 1))
              else
                ignored=$((ignored + 1))
              fi
            done <"$scan"
            if [ "$ignored" -gt 0 ]; then
              echo "Ignored ${ignored} scanned host key(s) that were not in the trusted set."
            fi
            if [ "$matched" -eq 0 ]; then
              echo "::error::SSH host key verification failed for ${SSH_HOST}:${SSH_PORT}. No scanned key matches the trusted fingerprint(s)."
              echo "Scanned:"
              ssh-keygen -lf "$scan" -E sha256 || true
              echo "Trusted:"
              cat "$trusted"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            UpdateHostKeys no
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: ssh server 'echo "connected as $(whoami) on $(hostname)"'

      - name: Ship image
        run: gunzip -c image.tar.gz | ssh server 'docker load'

      - name: Keep previous + move tag
        run: |
          ssh server "docker image inspect $IMAGE:$CHAN >/dev/null 2>&1 && docker tag $IMAGE:$CHAN $IMAGE:$PREV || echo 'no current image, first deploy'"
          ssh server "docker tag $IMAGE:$VERSION $IMAGE:$CHAN"
          echo "MOVED=1" >> "$GITHUB_ENV"

      - name: Pick migrate service
        if: inputs.migrate-enabled
        run: |
          MIG="${{ inputs.migrate-service }}"
          [ -z "$MIG" ] && MIG="${SERVICES%% *}"
          echo "MIG=$MIG" >> "$GITHUB_ENV"

      - name: Migrate
        if: inputs.migrate-enabled
        run: ssh server "cd $APP_DIR && docker compose run --rm --no-deps $MIG php artisan migrate --force"

      - name: Restart services
        run: ssh server "cd $APP_DIR && docker compose up -d --no-build --force-recreate $SERVICES"

      - name: Optimize
        if: inputs.optimize-enabled
        run: |
          OPT="${{ inputs.migrate-service }}"
          [ -z "$OPT" ] && OPT="${SERVICES%% *}"
          ssh server "cd $APP_DIR && docker compose exec -T $OPT php artisan optimize" || true

      - name: Health check
        env:
          HEALTH_STATUS_CODES: ${{ inputs.health-status-codes }}
        run: |
          read_health_spec() {
            if [ -z "${HEALTH_STATUS_CODES+x}" ]; then
              printf '%s' "2xx"
            elif [ -z "$HEALTH_STATUS_CODES" ]; then
              echo "::error::health-status-codes is empty" >&2
              exit 1
            else
              printf '%s' "$HEALTH_STATUS_CODES"
            fi
          }

          validate_health_spec() {
            local raw spec tok lo hi count
            raw=$(read_health_spec) || exit $?
            spec=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr ',;' '\n' | tr -s '[:space:]' '\n')
            count=0
            while IFS= read -r tok; do
              [ -z "$tok" ] && continue
              if [[ "$tok" =~ ^([1-5])xx$ ]]; then
                count=$((count + 1))
                continue
              elif [[ "$tok" =~ ^([0-9]{3})-([0-9]{3})$ ]]; then
                lo=${BASH_REMATCH[1]}
                hi=${BASH_REMATCH[2]}
                if (( 10#$lo > 10#$hi )); then
                  echo "::error::Invalid health-status-codes range '${tok}'."
                  exit 1
                fi
                count=$((count + 1))
              elif [[ "$tok" =~ ^[0-9]{3}$ ]]; then
                count=$((count + 1))
              else
                echo "::error::Invalid health-status-codes token '${tok}'. Use 2xx, 200, or 200-399, comma-separated."
                exit 1
              fi
            done <<< "$spec"
            if [ "$count" -eq 0 ]; then
              echo "::error::health-status-codes has no status tokens. Use 2xx, 200, or 200-399, comma-separated."
              exit 1
            fi
          }

          health_code_ok() {
            local code raw spec tok lo hi
            code=$(printf '%s' "$1" | tr -d '[:space:]')
            [[ "$code" =~ ^[0-9]{3}$ ]] || return 1
            raw=$(read_health_spec) || exit $?
            spec=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr ',;' '\n' | tr -s '[:space:]' '\n')
            while IFS= read -r tok; do
              [ -z "$tok" ] && continue
              if [[ "$tok" =~ ^([1-5])xx$ ]]; then
                if [[ "${code:0:1}" == "${BASH_REMATCH[1]}" ]]; then
                  return 0
                fi
              elif [[ "$tok" =~ ^([0-9]{3})-([0-9]{3})$ ]]; then
                lo=${BASH_REMATCH[1]}
                hi=${BASH_REMATCH[2]}
                if (( 10#$code >= 10#$lo && 10#$code <= 10#$hi )); then
                  return 0
                fi
              elif [[ "$tok" =~ ^[0-9]{3}$ ]]; then
                if [[ "$code" == "$tok" ]]; then
                  return 0
                fi
              else
                echo "::error::Invalid health-status-codes token '${tok}'. Use 2xx, 200, or 200-399, comma-separated."
                exit 1
              fi
            done <<< "$spec"
            return 1
          }
          validate_health_spec
          for i in $(seq 1 ${{ inputs.health-retries }}); do
            CODE=$(ssh server "curl -s -o /dev/null -w '%{http_code}' $HEALTH_URL" || echo 000)
            if health_code_ok "$CODE"; then
              echo "healthy ✅ ($VERSION, HTTP $CODE)"
              echo "### Deployed \`$IMAGE:$VERSION\` to ${{ needs.prepare.outputs.target }} ✅" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting... ($i, HTTP $CODE)"
            sleep 3
          done
          echo "service did not become healthy ❌"
          ssh server "cd $APP_DIR && docker compose logs --tail 50 $SERVICES"
          exit 1

      - name: Auto rollback to :previous
        if: failure() && inputs.auto-rollback && env.MOVED == '1'
        run: |
          if ssh server "docker image inspect $IMAGE:$PREV" >/dev/null 2>&1; then
            ssh server "docker tag $IMAGE:$PREV $IMAGE:$CHAN && cd $APP_DIR && docker compose up -d --no-build --force-recreate $SERVICES"
            echo "### ↩️ Rolled back \`$IMAGE\` to :$PREV" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no :$PREV image to roll back to"
          fi

      - name: Cleanup old images
        if: always()
        run: ssh server 'docker image prune -f' || true

  # ───────────── 4b. review app (Traefik) ─────────────
  review:
    needs: [prepare, build]
    if: always() && inputs.deploy-enabled && needs.build.result == 'success' && (needs.prepare.outputs.target == 'review')
    runs-on: ubuntu-latest
    environment:
      name: review/${{ needs.prepare.outputs.slug }}
      url: https://${{ needs.prepare.outputs.slug }}.${{ inputs.review-domain }}
    concurrency:
      group: review-${{ inputs.image }}-${{ needs.prepare.outputs.slug }}
      cancel-in-progress: true
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SLUG: ${{ needs.prepare.outputs.slug }}
      PROJECT: ${{ inputs.image }}-${{ needs.prepare.outputs.slug }}
      REVIEW_HOST: ${{ needs.prepare.outputs.slug }}.${{ inputs.review-domain }}
      REVIEW_DIR: ${{ inputs.review-app-dir != '' && inputs.review-app-dir || inputs.app-dir }}
      REVIEW_FILE: ${{ inputs.review-compose-file }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST_FINGERPRINT: ${{ inputs.ssh-host-fingerprint }}
          ALLOW_INSECURE_SSH: ${{ inputs.allow-insecure-ssh }}
        run: |
          set -euo pipefail

          missing=()
          [ -z "${SSH_HOST:-}" ] && missing+=(SSH_HOST)
          [ -z "${SSH_PORT:-}" ] && missing+=(SSH_PORT)
          [ -z "${SSH_USER:-}" ] && missing+=(SSH_USER)
          [ -z "${SSH_KEY:-}" ] && missing+=(SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Deploy is enabled but these secrets are empty: ${missing[*]}. Pass SSH_HOST, SSH_PORT, SSH_USER and SSH_KEY, or set deploy-enabled: false for CI only."
            exit 1
          fi

          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          scan=$(mktemp)
          scan_err=$(mktemp)
          if ! ssh-keyscan -p "$SSH_PORT" -T 10 "$SSH_HOST" >"$scan" 2>"$scan_err"; then
            echo "::error::ssh-keyscan failed for ${SSH_HOST}:${SSH_PORT}"
            cat "$scan_err"
            exit 1
          fi
          grep -vE '^[[:space:]]*(#|$)' "$scan" >"${scan}.clean" || true
          mv "${scan}.clean" "$scan"
          if [ ! -s "$scan" ]; then
            echo "::error::ssh-keyscan returned no host keys for ${SSH_HOST}:${SSH_PORT}"
            cat "$scan_err"
            exit 1
          fi

          if [ "${ALLOW_INSECURE_SSH:-false}" = "true" ]; then
            echo "::warning::allow-insecure-ssh is true: SSH host key verification is disabled. The key returned by ssh-keyscan is trusted as-is. Do not use this against a host you cannot already trust."
            cat "$scan" > ~/.ssh/known_hosts
          else
            material=$(mktemp)
            printf '%s\n' "${SSH_HOST_FINGERPRINT:-}" >"$material"
            printf '%s\n' "${SSH_KNOWN_HOSTS:-}" >>"$material"
            if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
              kh=$(mktemp)
              printf '%s\n' "$SSH_KNOWN_HOSTS" >"$kh"
              if ssh-keygen -lf "$kh" -E sha256 >"${kh}.fp" 2>/dev/null; then
                cat "${kh}.fp" >>"$material"
              else
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ''|\#*) continue ;;
                  esac
                  fp=$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)
                  if [ -n "$fp" ]; then
                    printf '%s\n' "$fp" >>"$material"
                  fi
                done <"$kh"
              fi
            fi
            trusted=$(mktemp)
            sed -E 's/[Ss][Hh][Aa]256:/SHA256:/g' "$material" \
              | grep -oE 'SHA256:[A-Za-z0-9+/]+={0,2}' \
              | sort -u >"$trusted" || true
            if [ ! -s "$trusted" ]; then
              echo "::error::Refusing to deploy: no trusted SSH host key for ${SSH_HOST}:${SSH_PORT}. Set secret SSH_KNOWN_HOSTS (known_hosts lines or a public key) or input ssh-host-fingerprint (SHA256 fingerprint from ssh-keygen -lf). Verify that value out of band before saving it. To skip this check, set allow-insecure-ssh: true (insecure; off by default)."
              exit 1
            fi
            : > ~/.ssh/known_hosts
            matched=0
            ignored=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              fp=$(printf '%s\n' "$line" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' || true)
              if [ -n "$fp" ] && grep -qxF "$fp" "$trusted"; then
                printf '%s\n' "$line" >> ~/.ssh/known_hosts
                echo "SSH host key accepted: $fp"
                matched=$((matched + 1))
              else
                ignored=$((ignored + 1))
              fi
            done <"$scan"
            if [ "$ignored" -gt 0 ]; then
              echo "Ignored ${ignored} scanned host key(s) that were not in the trusted set."
            fi
            if [ "$matched" -eq 0 ]; then
              echo "::error::SSH host key verification failed for ${SSH_HOST}:${SSH_PORT}. No scanned key matches the trusted fingerprint(s)."
              echo "Scanned:"
              ssh-keygen -lf "$scan" -E sha256 || true
              echo "Trusted:"
              cat "$trusted"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            UpdateHostKeys no
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: ssh server 'echo "connected as $(whoami) on $(hostname)"'

      - name: Ship image
        run: gunzip -c image.tar.gz | ssh server 'docker load'

      - name: Start review app
        run: |
          ssh server "cd $REVIEW_DIR && IMAGE_TAG=$VERSION REVIEW_HOST=$REVIEW_HOST SLUG=$SLUG \
            docker compose -p $PROJECT -f $REVIEW_FILE up -d --no-build --force-recreate --remove-orphans"

      - name: Health check (via Traefik)
        env:
          HEALTH_STATUS_CODES: ${{ inputs.health-status-codes }}
        run: |
          read_health_spec() {
            if [ -z "${HEALTH_STATUS_CODES+x}" ]; then
              printf '%s' "2xx"
            elif [ -z "$HEALTH_STATUS_CODES" ]; then
              echo "::error::health-status-codes is empty" >&2
              exit 1
            else
              printf '%s' "$HEALTH_STATUS_CODES"
            fi
          }

          validate_health_spec() {
            local raw spec tok lo hi count
            raw=$(read_health_spec) || exit $?
            spec=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr ',;' '\n' | tr -s '[:space:]' '\n')
            count=0
            while IFS= read -r tok; do
              [ -z "$tok" ] && continue
              if [[ "$tok" =~ ^([1-5])xx$ ]]; then
                count=$((count + 1))
                continue
              elif [[ "$tok" =~ ^([0-9]{3})-([0-9]{3})$ ]]; then
                lo=${BASH_REMATCH[1]}
                hi=${BASH_REMATCH[2]}
                if (( 10#$lo > 10#$hi )); then
                  echo "::error::Invalid health-status-codes range '${tok}'."
                  exit 1
                fi
                count=$((count + 1))
              elif [[ "$tok" =~ ^[0-9]{3}$ ]]; then
                count=$((count + 1))
              else
                echo "::error::Invalid health-status-codes token '${tok}'. Use 2xx, 200, or 200-399, comma-separated."
                exit 1
              fi
            done <<< "$spec"
            if [ "$count" -eq 0 ]; then
              echo "::error::health-status-codes has no status tokens. Use 2xx, 200, or 200-399, comma-separated."
              exit 1
            fi
          }

          health_code_ok() {
            local code raw spec tok lo hi
            code=$(printf '%s' "$1" | tr -d '[:space:]')
            [[ "$code" =~ ^[0-9]{3}$ ]] || return 1
            raw=$(read_health_spec) || exit $?
            spec=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr ',;' '\n' | tr -s '[:space:]' '\n')
            while IFS= read -r tok; do
              [ -z "$tok" ] && continue
              if [[ "$tok" =~ ^([1-5])xx$ ]]; then
                if [[ "${code:0:1}" == "${BASH_REMATCH[1]}" ]]; then
                  return 0
                fi
              elif [[ "$tok" =~ ^([0-9]{3})-([0-9]{3})$ ]]; then
                lo=${BASH_REMATCH[1]}
                hi=${BASH_REMATCH[2]}
                if (( 10#$code >= 10#$lo && 10#$code <= 10#$hi )); then
                  return 0
                fi
              elif [[ "$tok" =~ ^[0-9]{3}$ ]]; then
                if [[ "$code" == "$tok" ]]; then
                  return 0
                fi
              else
                echo "::error::Invalid health-status-codes token '${tok}'. Use 2xx, 200, or 200-399, comma-separated."
                exit 1
              fi
            done <<< "$spec"
            return 1
          }
          validate_health_spec
          for i in $(seq 1 ${{ inputs.health-retries }}); do
            CODE=$(ssh server "curl -s -o /dev/null -w '%{http_code}' -H 'Host: $REVIEW_HOST' http://127.0.0.1/" || echo 000)
            if health_code_ok "$CODE"; then
              echo "healthy ✅ ($REVIEW_HOST, HTTP $CODE)"
              echo "### Review app https://$REVIEW_HOST ✅" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting... ($i, HTTP $CODE)"
            sleep 3
          done
          echo "service did not become healthy ❌"
          ssh server "cd $REVIEW_DIR && IMAGE_TAG=$VERSION REVIEW_HOST=$REVIEW_HOST SLUG=$SLUG docker compose -p $PROJECT -f $REVIEW_FILE logs --tail 50"
          exit 1

  # ───────────── cleanup review app (branch deleted / PR closed) ─────────────
  cleanup:
    if: inputs.deploy-enabled && (inputs.review-enabled && (github.event_name == 'delete' || (github.event_name == 'pull_request' && github.event.action == 'closed')))
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DELETED_REF: ${{ github.event.ref }}
      REF_TYPE: ${{ github.event.ref_type }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEW_DIR: ${{ inputs.review-app-dir != '' && inputs.review-app-dir || inputs.app-dir }}
      REVIEW_FILE: ${{ inputs.review-compose-file }}
    steps:
      - name: Review project name
        run: |
          slugify() { echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-30 | sed -E 's/-+$//'; }
          if [ "$GITHUB_EVENT_NAME" = delete ]; then
            [ "$REF_TYPE" = branch ] || { echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; }
            SLUG=$(slugify "$DELETED_REF")
          else
            SLUG="pr-$PR_NUMBER"
          fi
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "PROJECT=${{ inputs.image }}-$SLUG" >> "$GITHUB_ENV"

      - name: Setup SSH
        if: env.SKIP != '1'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
